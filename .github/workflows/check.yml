# Checks the formula the way a user's Homebrew would load it: style, audit, a
# download that verifies the sha256 against the published release, then an
# install that runs the formula's test.
name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formula:
    runs-on: macos-latest
    env:
      FORMULA: aavishay/azure-devops-board/azure-devops-board
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v7

      # Load this checkout as the tap, so the PR's version of the formula is what gets checked.
      # Homebrew 7 refuses formulae from untrusted third-party taps, so trust it first.
      - name: Use this checkout as the tap
        run: |
          TAP="$(brew --repository)/Library/Taps/aavishay/homebrew-azure-devops-board"
          rm -rf "$TAP"
          mkdir -p "$(dirname "$TAP")"
          ln -s "$GITHUB_WORKSPACE" "$TAP"
          brew trust --tap aavishay/azure-devops-board

      - name: Style
        run: brew style --formula "$FORMULA"

      - name: Audit
        run: brew audit --formula --online "$FORMULA"

      # Fails if the release asset is missing or its sha256 doesn't match the formula.
      - name: Download and verify the checksum
        run: brew fetch --formula --force "$FORMULA"

      - name: Install and test
        run: |
          brew install --formula "$FORMULA"
          brew test "$FORMULA"
